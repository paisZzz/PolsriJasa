<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login PolsriJasa</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="login">
    <div class="auth-shell">
      <div class="auth-card">
        <div class="auth-brand">
          <span class="logo">PJ</span>
          <span>PolsriJasa</span>
        </div>

        <h1>Masuk ke akun</h1>
        <p>Silakan masuk untuk mengakses marketplace jasa mahasiswa.</p>

        <form id="loginForm" class="auth-form">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" value="demo@polsrijasa.com" required />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" value="demo123" required />
          </div>

          <button class="btn btn-primary" type="submit">Masuk</button>
          <div id="loginError" class="login-error" aria-live="polite"></div>
        </form>

        <div class="demo-account">
          <strong>Akun demo:</strong><br />
          Email: demo@polsrijasa.com<br />
          Password: demo123
        </div>
      </div>
    </div>

    <script src="main.js" defer></script>
  </body>
</html>
